name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Fuzz response decoding (smoke)
        run: go test -run '^$' -fuzz '^FuzzDecodeSystemOneResponse$' -fuzztime=10s .
      - name: Fuzz request validation (smoke)
        run: go test -run '^$' -fuzz '^FuzzValidateRequestJSON$' -fuzztime=10s .

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-input: '1.26.6'
          go-package: ./...
          repo-checkout: false
